version: '3.8'

services:
  inference-api:
    build: .
    container_name: churn-inference-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - /home/mark-hill/airflow-quickstart/data/models:/models
    environment:
      - MODEL_DIR=/models
      - DEBUG=True
      - PORT=8000
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
