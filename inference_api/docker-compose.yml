version: '3.8'

services:
  # Main API service (Group A)
  inference-api:
    build: .
    container_name: churn-inference-api
    environment:
      - PORT=8000
      - MODEL_PATH=/models/random_forest_RF_best_20250715T162422/model.joblib
      - LOG_LEVEL=INFO
      - AB_TEST_GROUP=A
    volumes:
      - ./app:/app/app
      - /home/mark-hill/airflow-quickstart/data/models:/models
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app-network

  # Shadow API service (Group B)
  shadow-inference-api:
    build: .
    container_name: shadow-churn-inference-api
    environment:
      - PORT=8001
      - MODEL_PATH=/models/logistic_regression_LR_second_best_20250715T162452/model.joblib
      - LOG_LEVEL=INFO
      - AB_TEST_GROUP=B
      - SHADOW_MODE=true
    volumes:
      - ./app:/app/app
      - /home/mark-hill/airflow-quickstart/data/models:/models
      - ./logs:/app/logs
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - app-network

  # NGINX Load Balancer
  nginx:
    image: nginx:1.23-alpine
    container_name: churn-nginx
    ports:
      - "8083:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - inference-api
      - shadow-inference-api
    networks:
      - app-network


  #frontend
  frontend:
    build: ../churn-insight-ui-main
    container_name: churn-frontend
    environment:
      - VITE_AB_TEST_GROUP=
    ports:
      - "8081:8081"
    volumes:
      - ../churn-insight-ui-main/logs:/app/logs
      - ../churn-insight-ui-main/src:/app/src
    depends_on:
      - inference-api
      - shadow-inference-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
