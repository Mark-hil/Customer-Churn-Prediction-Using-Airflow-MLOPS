server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400
    timeout: 10s

target_config:
  sync_period: 10s

scrape_configs:
- job_name: ab_test_logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: ab_test
      __path__: /logs/ab_test_logs/*.json
  pipeline_stages:
  - json:
      expressions:
        timestamp: timestamp
        model_type: model_type
        prediction: prediction
        ground_truth: ground_truth
        model_name: model_name
        model_version: model_version
        request_id: request_id
        status: status
  - labels:
      model_type:
      status:
  - timestamp:
      source: timestamp
      format: RFC3339
  - output:
      source: |
        {
          "request_id": "{{ .request_id }}",
          "model_type": "{{ .model_type }}",
          "model_name": "{{ .model_name }}",
          "model_version": "{{ .model_version }}",
          "prediction": {{ .prediction | toJson }},
          "ground_truth": {{ .ground_truth | toJson }},
          "status": "{{ .status }}"
        }