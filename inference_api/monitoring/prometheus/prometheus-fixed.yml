global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Production API (Group A)
  - job_name: 'inference_api_production'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['172.19.0.3:8000']
        labels:
          service: 'inference-api'
          model_group: 'production'
          instance: 'production'

  # Shadow API (Group B)
  - job_name: 'inference_api_shadow'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['172.19.0.2:8001']
        labels:
          service: 'inference-api'
          model_group: 'shadow'
          instance: 'shadow'
