global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Production API (Group A)
  - job_name: 'inference_api_production'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['churn-inference-api:8000']
        labels:
          service: 'inference-api'
          model_group: 'production'
          instance: 'production'

  # Shadow API (Group B)
  - job_name: 'inference_api_shadow'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['shadow-churn-inference-api:8001']
        labels:
          service: 'inference-api'
          model_group: 'shadow'
          instance: 'shadow'

  # Node exporter for system metrics
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']
        labels:
          service: 'node-metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9091']  # Updated port to match new mapping
